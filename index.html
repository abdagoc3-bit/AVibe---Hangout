<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVibe - Welcome</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="floating-elements">
        <span class="element" style="left: 10%; animation-duration: 6s; animation-delay: 0s;">✨</span>
        <span class="element" style="left: 20%; animation-duration: 8s; animation-delay: 2s;">💖</span>
        <span class="element" style="left: 35%; animation-duration: 7s; animation-delay: 1s;">🚗</span>
        <span class="element" style="left: 50%; animation-duration: 9s; animation-delay: 3s;">🧺</span>
        <span class="element" style="left: 65%; animation-duration: 6s; animation-delay: 1.5s;">☕</span>
        <span class="element" style="left: 80%; animation-duration: 7s; animation-delay: 2.5s;">⭐</span>
        <span class="element" style="left: 92%; animation-duration: 8s; animation-delay: 0.5s;">🌸</span>
    </div>

    <div class="landing-container">


        <img src="AVibe_logo.png" alt="AVibe Logo" class="landing-logo">
        
        <p class="landing-sub">Ready for your next meet, coffee date, or barkada hangout?</p>

        <a href="plan.html" class="letsGo-btn">LET'S GO!</a>
    </div>
</body>
</html>
